# Path Traversal — Go HTTP Handler

A Go HTTP handler that reads files based on a user-supplied `path` query parameter
without sanitizing directory traversal sequences. The handler constructs a file
path using `filepath.Join` but the user input is not validated against a base directory.

Ground truth: one path traversal sink at `src/handler/view.go:28`.

