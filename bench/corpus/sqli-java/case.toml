# SQL Injection — Java Servlet

A minimal Java web application with an SQL injection vulnerability in a
user-facing search endpoint. The `doGet` method concatenates user input directly
into a SQL query string without parameterization.

Ground truth: one injectable sink at `src/db/QueryExecutor.java:42`.

