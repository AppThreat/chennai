[package]
name = "chennai-bench"
version = "0.1.0"
edition = "2021"
description = "Benchmark harness for measuring chennai analysis quality and token cost"

[[bin]]
name = "chennai-bench"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
